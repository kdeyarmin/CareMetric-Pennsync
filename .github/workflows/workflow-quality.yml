name: Workflow Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'base44/_shared/**'
      - 'base44/functions/**'
      - 'src/components/oasis/**'
      - 'src/components/fax/**'
      - 'src/components/voice/**'
      - 'src/components/messaging/**'
      - 'src/components/medication/**'
      - 'src/components/timeoff/**'
      - 'base44/functions/processPatientFileUpdate/**'
      - 'base44/functions/deduplicatePatients/**'
      - 'base44/entities/**'
      - 'base44/schemaContract.test.js'
      - 'base44/securityGuardrails.test.js'
      - 'base44/functions/getApprovedTimeOff/**'
      - 'src/components/hub-tabs/ReferralAdmissionNote.jsx'
      - 'src/components/admin/ReportsCenter.jsx'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workflow-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'base44/_shared/**'
      - 'base44/functions/**'
      - 'src/components/oasis/**'
      - 'src/components/fax/**'
      - 'src/components/voice/**'
      - 'src/components/messaging/**'
      - 'src/components/medication/**'
      - 'src/components/timeoff/**'
      - 'base44/functions/processPatientFileUpdate/**'
      - 'base44/functions/deduplicatePatients/**'
      - 'base44/entities/**'
      - 'base44/schemaContract.test.js'
      - 'base44/securityGuardrails.test.js'
      - 'base44/functions/getApprovedTimeOff/**'
      - 'src/components/hub-tabs/ReferralAdmissionNote.jsx'
      - 'src/components/admin/ReportsCenter.jsx'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workflow-quality.yml'

concurrency:
  group: workflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workflow target files
        run: pnpm run lint:workflow-targets

      - name: Typecheck utility modules
        run: pnpm run typecheck:utils

      - name: Run utility unit tests
        run: pnpm run test:utils

      - name: Run schema-contract tests
        run: pnpm run test:contracts

      - name: Run security guardrail tests
        run: pnpm run test:security

      - name: Check Base44 functions transpile (syntax)
        run: pnpm run check:backend-transpile

      - name: Check inlined shared helpers are in sync
        run: pnpm run check:shared-helpers

      - name: Run component tests
        run: pnpm run test:components

      - name: High-signal typecheck
        run: pnpm run typecheck:signal

      - name: Typecheck (informational baseline)
        run: pnpm run typecheck
        continue-on-error: true

      - name: Build app
        run: pnpm run build

      - name: Production audit (informational baseline)
        run: pnpm run audit:prod
        continue-on-error: true
