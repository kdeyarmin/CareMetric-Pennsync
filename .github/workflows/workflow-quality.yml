name: Workflow Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'base44/_shared/**'
      - 'base44/functions/**'
      - 'base44/workflows/**'
      - 'src/components/oasis/**'
      - 'src/components/fax/**'
      - 'src/components/voice/**'
      - 'src/components/messaging/**'
      - 'src/components/medication/**'
      - 'src/components/timeoff/**'
      - 'base44/functions/processPatientFileUpdate/**'
      - 'base44/functions/deduplicatePatients/**'
      - 'base44/entities/**'
      - 'base44/schemaContract.test.js'
      - 'base44/securityGuardrails.test.js'
      - 'base44/functions/getApprovedTimeOff/**'
      - 'src/components/hub-tabs/ReferralAdmissionNote.jsx'
      - 'src/components/admin/ReportsCenter.jsx'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workflow-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'base44/_shared/**'
      - 'base44/functions/**'
      - 'base44/workflows/**'
      - 'src/components/oasis/**'
      - 'src/components/fax/**'
      - 'src/components/voice/**'
      - 'src/components/messaging/**'
      - 'src/components/medication/**'
      - 'src/components/timeoff/**'
      - 'base44/functions/processPatientFileUpdate/**'
      - 'base44/functions/deduplicatePatients/**'
      - 'base44/entities/**'
      - 'base44/schemaContract.test.js'
      - 'base44/securityGuardrails.test.js'
      - 'base44/functions/getApprovedTimeOff/**'
      - 'src/components/hub-tabs/ReferralAdmissionNote.jsx'
      - 'src/components/admin/ReportsCenter.jsx'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workflow-quality.yml'

permissions:
  contents: read

concurrency:
  group: workflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `if: ${{ !cancelled() }}` from here on, the same pattern and for the same
      # reason as the test block in ci.yml: one failing step must not hide its
      # siblings. This job is where that mattered. A lockfile desync failed the
      # install above and every step below it was SKIPPED, so a red `quality`
      # meant "install broke" and said nothing about the fourteen checks that
      # never ran - sixteen defects reached main under that red, measured by
      # nothing. The guard cannot make the install succeed, and it is not meant
      # to: it makes each check report its own verdict, so a run that did not
      # measure something is legible as such instead of being silent.
      #
      # The first step of the block stays unguarded on purpose - it has no
      # sibling above it to be hidden by.
      - name: Lint workflow target files
        run: pnpm run lint:workflow-targets

      - name: Typecheck utility modules
        if: ${{ !cancelled() }}
        run: pnpm run typecheck:utils

      - name: Run utility unit tests
        if: ${{ !cancelled() }}
        run: pnpm run test:utils

      - name: Run schema-contract tests
        if: ${{ !cancelled() }}
        run: pnpm run test:contracts

      - name: Run security guardrail tests
        if: ${{ !cancelled() }}
        run: pnpm run test:security

      - name: Check Base44 functions transpile (syntax)
        if: ${{ !cancelled() }}
        run: pnpm run check:backend-transpile

      - name: Check OASIS review worksheet is current
        if: ${{ !cancelled() }}
        run: pnpm run check:oasis-worksheet

      - name: Check inlined shared helpers are in sync
        if: ${{ !cancelled() }}
        run: pnpm run check:shared-helpers

      - name: Run component tests
        if: ${{ !cancelled() }}
        run: pnpm run test:components

      - name: High-signal typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck:signal

      - name: Typecheck (informational baseline)
        run: pnpm run typecheck
        continue-on-error: true

      - name: Build app
        if: ${{ !cancelled() }}
        run: pnpm run build

      - name: Production audit (informational baseline)
        run: pnpm run audit:prod
        continue-on-error: true

      # The step above carries continue-on-error, so it reports and can never
      # fail a build: on 2026-09-30 it went from one low advisory to fourteen,
      # seven of them high, across green runs. Keep it for the printed tables and
      # gate on the baseline instead, which fails on an advisory that is new, that
      # escalated, that reached a new dependency path, or whose baseline entry is
      # now stale. The known ones are recorded in audit-advisory-baseline.json
      # with a reason each, so this is green on a repository whose advisories have
      # all been read. It fails closed: an audit that cannot run is reported as
      # unmeasured rather than as nothing found.
      - name: Dependency advisory baseline
        if: ${{ !cancelled() }}
        run: pnpm run check:audit-advisories
