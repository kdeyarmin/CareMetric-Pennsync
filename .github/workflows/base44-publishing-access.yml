name: Base44 publishing access (read-only)

# A diagnostic, not a deployment. It classifies the configured credential by
# its shape and proves whether Base44 accepts it with one read-only GET of the
# production app under each header Base44 documents, printing only HTTP status
# codes. It never prints a credential, never logs in, never deploys and never
# writes. Production environment protection rules, when configured, remain in
# force.
#
# Why the shape matters (measured 2026-10-09): the deployment workflows accept
# a workspace API key (`b44k_`, which the Base44 CLI reads itself and sends as
# `api_key`) or a personal access token (`b44u_`, which Base44 accepts only as
# `Authorization: Bearer`; tools-base44-cli-credential.mjs hands it to the
# CLI). Account API keys stop working on 2026-10-15. A secret of any other
# kind is present but unusable, and this job says which kind it is.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/base44-publishing-access.yml'

permissions: {}

concurrency:
  group: base44-publishing-access
  cancel-in-progress: false

jobs:
  inspect:
    name: Check configured publishing access without login or deployment
    if: github.repository == 'kdeyarmin/CareMetric-Pennsync' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - name: Classify the credential and probe it read-only
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const APP = '694ec16e72e01b60d22f7cbf';
          const raw = typeof process.env.BASE44_API_KEY === 'string' ? process.env.BASE44_API_KEY : '';
          const key = raw.trim();
          // The kind is read from the shape only. The one fragment ever printed
          // is a short lowercase prefix before the first underscore (such as
          // `b44k`), which identifies the key type and carries no secret.
          const prefix = /^([a-z0-9]{2,8})_/.exec(key)?.[1] ?? null;
          const kind = !key ? 'absent'
            : /^BASE44_API_KEY\s*=/.test(key) ? 'pasted_with_variable_name'
            : /^["'`]|["'`]$/.test(key) ? 'pasted_with_quotes'
            : /\s/.test(key) ? 'contains_whitespace'
            : key.startsWith('b44k_') ? 'workspace_api_key'
            : key.startsWith('b44u_') ? 'personal_access_token'
            : /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key) ? 'jwt_session_token'
            : 'other';
          async function probe(headers) {
            try {
              const response = await fetch(`https://app.base44.com/api/apps/${APP}`, {
                method: 'GET', headers, signal: AbortSignal.timeout(20000),
              });
              await response.arrayBuffer().catch(() => null);
              return response.status;
            } catch {
              return 'unreachable';
            }
          }
          (async () => {
            const usable = key && !/\s/.test(key);
            const report = {
              operation: 'credential_shape_and_read_only_probe',
              target_app_id: APP,
              api_key_secret_present: Boolean(key),
              api_key_kind: kind,
              api_key_prefix: prefix,
              workspace_key_configured: kind === 'workspace_api_key',
              access_token_configured: Boolean(process.env.BASE44_ACCESS_TOKEN?.trim()),
              refresh_token_configured: Boolean(process.env.BASE44_REFRESH_TOKEN?.trim()),
              probe_get_app_with_api_key_header: usable ? await probe({ api_key: key }) : 'not_attempted',
              probe_get_app_with_bearer_header: usable ? await probe({ Authorization: `Bearer ${key}` }) : 'not_attempted',
              login_attempted: false,
              deployment_attempted: false,
              production_deployed: false,
            };
            report.deployment_workflows_can_use_api_key = kind === 'workspace_api_key' || kind === 'personal_access_token';
            console.log(JSON.stringify(report, null, 2));
            const accepted = [report.probe_get_app_with_api_key_header, report.probe_get_app_with_bearer_header]
              .some((status) => status === 200);
            const label = kind.replaceAll('_', ' ');
            const state = report.deployment_workflows_can_use_api_key && accepted
              ? `A ${label} is configured and Base44 accepted it for a read of the production app. The deployment workflows can use it.`
              : report.deployment_workflows_can_use_api_key
                ? `A ${label} is configured, but Base44 did not accept it for a read of the production app.`
                : `BLOCKED for the deployment workflows: BASE44_API_KEY is ${kind}${prefix ? ` (prefix ${prefix}_)` : ''}; they accept a workspace API key (b44k_) or a personal access token (b44u_).`
                  + (accepted ? ' Base44 did accept it for a read, so it is a valid credential of another kind.' : '');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '# Base44 publishing access — diagnostic only\n\n' + state
              + '\n\nNo secret values were emitted. One read-only GET per header; no login, site publication, backend deployment, data mutation, or DNS change was performed.\n');
          })();
          NODE
