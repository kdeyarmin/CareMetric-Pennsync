name: Deploy production backend functions

# Deliberately manual, like the site publication beside it. A merge, a source
# sync or a secret change is not a deployment request: Base44 pulls `main` into
# the app's stored source, but each backend function keeps serving the code it
# was last deployed with until it is redeployed, and setting a secret only
# restarts that deployed code. This workflow is the one step that makes the
# deployed functions match `main`. It pushes functions only: no entity, auth,
# agent or connector push, and never `--force` (which deletes remote functions
# that are not in the tree).
#
# A function deploy lands in Base44's preview (draft) deployment; production
# keeps serving the published revision until the app is published (measured
# 2026-10-09: all 289 deployed, every released function still answered with
# its pre-release code until the app was published). So this workflow then
# publishes the app. Publishing also rebuilds the site from base44/config.jsonc,
# which leaves the central Help launcher off, so the last step dispatches the
# site-only publication to put the exact, verified build back.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: Space-separated function names to deploy, or "all" (unchanged functions are skipped)
        type: string
        required: true
        default: all

permissions:
  contents: read
  # Only to dispatch the site-only publication after the app is published.
  actions: write

concurrency:
  group: caremetric-pennsync-production-function-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'kdeyarmin/CareMetric-Pennsync' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Checkout the explicitly requested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `pnpm test` resolves a fixed historical commit (see the site
          # publication workflow), so the full history is required.
          fetch-depth: 0

      - name: Stop before invoking Base44 when persistent publishing access is missing
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
        run: node tools-production-publish-preflight.mjs

      - name: Resolve the requested functions against the tree
        env:
          REQUESTED_FUNCTIONS: ${{ inputs.functions }}
        run: node tools-production-function-selection.mjs > "$RUNNER_TEMP/function-selection.json"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install locked application dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` runs suites that resolve packages from their own service
      # directories, which ci.yml installs as separate steps. Without these,
      # every authority store suite dies at load with ERR_MODULE_NOT_FOUND
      # before an assertion runs (measured 2026-10-09, the first run that got
      # past the credential preflight). Keep them identical to ci.yml's.
      - name: Install isolated authority test dependencies
        run: pnpm --dir services/authority-store install --ignore-workspace --frozen-lockfile

      - name: Install ported API service dependencies
        run: pnpm --dir services/pennsync-api install --frozen-lockfile

      - name: Validate the candidate before deployment
        run: |
          pnpm run lint
          pnpm test
          pnpm run check:shared-helpers
          pnpm run check:backend-transpile
          pnpm run typecheck:signal

      - name: Deploy only the backend functions with the persistent publishing credential
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Check again directly before the CLI; no absent-key fallback to login.
          node tools-production-publish-preflight.mjs
          # A workspace key (b44k_) is read by the CLI itself; a personal access
          # token (b44u_) is handed to it as an owner-only session file, removed
          # when this step ends.
          trap 'rm -f "$HOME/.base44/auth/auth.json"' EXIT
          node tools-base44-cli-credential.mjs
          cli_dir="$RUNNER_TEMP/base44-functions-cli"
          mkdir -p "$cli_dir"
          printf '{"private":true}\n' > "$cli_dir/package.json"
          # Pinned: 0.1.32 is the version verified to bundle base44/shared/ and
          # resolve base44:runtime for the editor's newer function format. It
          # depends on @deno/loader from JSR's npm registry (npm.jsr.io), a
          # URL-resolved package that pnpm 11 refuses by default, so that check
          # is relaxed for this one isolated install, outside the workspace.
          if ! pnpm --dir "$cli_dir" add --ignore-scripts --config.block-exotic-subdeps=false base44@0.1.32 \
            > "$RUNNER_TEMP/base44-cli-install.log" 2>&1; then
            echo 'BASE44_CLI_INSTALL_FAILED: nothing was deployed.'
            tail -n 20 "$RUNNER_TEMP/base44-cli-install.log"
            exit 2
          fi
          cli="$cli_dir/node_modules/.bin/base44"
          # A protected metadata read must succeed before anything is deployed.
          if ! timeout --kill-after=5s 45s "$cli" --app-id 694ec16e72e01b60d22f7cbf \
            --json functions list \
            > "$RUNNER_TEMP/base44-access-check.json" 2> "$RUNNER_TEMP/base44-access-check.log" < /dev/null; then
            echo 'BASE44_PRODUCTION_ACCESS_CHECK_FAILED: nothing was deployed.'
            exit 2
          fi
          mapfile -t names < <(node -e "const s=require(process.argv[1]); for (const n of s.names) console.log(n)" "$RUNNER_TEMP/function-selection.json")
          if ! timeout --kill-after=10s 3000s "$cli" --app-id 694ec16e72e01b60d22f7cbf \
            --json functions deploy "${names[@]}" \
            > "$RUNNER_TEMP/base44-functions-receipt.json" 2> "$RUNNER_TEMP/base44-functions.log" < /dev/null; then
            echo 'BASE44_FUNCTION_DEPLOYMENT_FAILED: inspect the function deployment status in Base44 before retrying.'
            tail -n 40 "$RUNNER_TEMP/base44-functions.log" | sed -E 's/(b44k_)[A-Za-z0-9_-]+/\1REDACTED/g'
            exit 2
          fi
          echo 'The CLI reported function deployment success. Publishing follows.'

      - name: Publish the app so production serves the deployed functions
        id: publish
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node tools-production-publish-preflight.mjs
          # Trimmed as the preflight, the CLI helper and the CLI trim it, so a
          # padded secret cannot pass the preflight and fail only here, after
          # the functions are already deployed to preview.
          key="$(node -e 'process.stdout.write(String(process.env.BASE44_API_KEY || "").trim())')"
          # A workspace key goes in the api_key header, as the CLI sends it; a
          # personal access token must be a Bearer token (Base44 rejects it in
          # api_key: measured 2026-10-09). The response is not printed: it is
          # the whole app document.
          case "$key" in
            b44k_*) auth_header="api_key: ${key}" ;;
            *) auth_header="Authorization: Bearer ${key}" ;;
          esac
          if ! curl --silent --show-error --fail --max-time 900 \
            -X POST -H "$auth_header" -H 'Content-Type: application/json' \
            --data '{}' \
            -o "$RUNNER_TEMP/base44-publish-receipt.json" \
            https://app.base44.com/api/apps/694ec16e72e01b60d22f7cbf/deploy \
            2> "$RUNNER_TEMP/base44-publish.log"; then
            echo 'BASE44_APP_PUBLISH_FAILED: the functions are deployed to preview but production is unchanged.'
            sed -E 's/(b44k_)[A-Za-z0-9_-]+/\1REDACTED/g' "$RUNNER_TEMP/base44-publish.log" | tail -n 5
            exit 2
          fi
          echo 'The app was published. Live verification follows.'

      - name: Verify every comparable deployed function against the tree
        env:
          VERIFY_REPORT: ${{ runner.temp }}/pennsync-function-verification.json
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools-live-function-sync.mjs --json > "$VERIFY_REPORT"; then
              {
                echo '## Deployed functions verified'
                echo 'Every function this probe can compare matched the tree.'
                echo 'This does NOT verify authenticated behaviour, tenancy or data.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo 'Function deployment is NOT verified.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Publishing rebuilt the site from base44/config.jsonc. Put the exact,
      # validated build back through the site-only publication, which verifies
      # every asset on both production origins itself. This keys on the
      # publish, not on the verification above: a drifted or unverifiable
      # function check still fails the job, but must not leave the rebuilt
      # site (Help launcher off) live.
      - name: Dispatch the site-only publication to restore the exact build
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-production-frontend.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f central_help_enabled=true
          echo 'Dispatched "Publish production frontend (site only)" on main.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve sanitized verification result only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-function-verification
          path: ${{ runner.temp }}/pennsync-function-verification.json
          if-no-files-found: ignore
          retention-days: 14
