name: Deploy production backend functions

# Deliberately manual, like the site publication beside it. A merge, a source
# sync or a secret change is not a deployment request: Base44 pulls `main` into
# the app's stored source, but each backend function keeps serving the code it
# was last deployed with until it is redeployed, and setting a secret only
# restarts that deployed code. This workflow is the one step that makes the
# deployed functions match `main`. It changes functions only: no site, entity,
# auth, agent or connector push, and never `--force` (which deletes remote
# functions that are not in the tree).
on:
  workflow_dispatch:
    inputs:
      functions:
        description: Space-separated function names to deploy, or "all" (unchanged functions are skipped)
        type: string
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: caremetric-pennsync-production-function-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'kdeyarmin/CareMetric-Pennsync' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Checkout the explicitly requested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `pnpm test` resolves a fixed historical commit (see the site
          # publication workflow), so the full history is required.
          fetch-depth: 0

      - name: Stop before invoking Base44 when persistent publishing access is missing
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
        run: node tools-production-publish-preflight.mjs

      - name: Resolve the requested functions against the tree
        env:
          REQUESTED_FUNCTIONS: ${{ inputs.functions }}
        run: node tools-production-function-selection.mjs > "$RUNNER_TEMP/function-selection.json"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install locked application dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the candidate before deployment
        run: |
          pnpm run lint
          pnpm test
          pnpm run check:shared-helpers
          pnpm run check:backend-transpile
          pnpm run typecheck:signal

      - name: Deploy only the backend functions with workspace-key authentication
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Check again directly before the CLI; no absent-key fallback to login.
          node tools-production-publish-preflight.mjs
          cli_dir="$RUNNER_TEMP/base44-functions-cli"
          mkdir -p "$cli_dir"
          printf '{"private":true}\n' > "$cli_dir/package.json"
          pnpm --dir "$cli_dir" add --ignore-scripts base44 > "$RUNNER_TEMP/base44-cli-install.log" 2>&1
          cli="$cli_dir/node_modules/.bin/base44"
          # A protected metadata read must succeed before anything is deployed.
          if ! timeout --kill-after=5s 45s "$cli" --app-id 694ec16e72e01b60d22f7cbf \
            --json functions list \
            > "$RUNNER_TEMP/base44-access-check.json" 2> "$RUNNER_TEMP/base44-access-check.log" < /dev/null; then
            echo 'BASE44_PRODUCTION_ACCESS_CHECK_FAILED: nothing was deployed.'
            exit 2
          fi
          mapfile -t names < <(node -e "const s=require(process.argv[1]); for (const n of s.names) console.log(n)" "$RUNNER_TEMP/function-selection.json")
          if ! timeout --kill-after=10s 3000s "$cli" --app-id 694ec16e72e01b60d22f7cbf \
            --json functions deploy "${names[@]}" \
            > "$RUNNER_TEMP/base44-functions-receipt.json" 2> "$RUNNER_TEMP/base44-functions.log" < /dev/null; then
            echo 'BASE44_FUNCTION_DEPLOYMENT_FAILED: inspect the function deployment status in Base44 before retrying.'
            tail -n 40 "$RUNNER_TEMP/base44-functions.log" | sed -E 's/(b44k_)[A-Za-z0-9_-]+/\1REDACTED/g'
            exit 2
          fi
          echo 'The CLI reported function deployment success. Live verification follows.'

      - name: Verify every comparable deployed function against the tree
        env:
          VERIFY_REPORT: ${{ runner.temp }}/pennsync-function-verification.json
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools-live-function-sync.mjs --json > "$VERIFY_REPORT"; then
              {
                echo '## Deployed functions verified'
                echo 'Every function this probe can compare matched the tree.'
                echo 'This does NOT verify authenticated behaviour, tenancy or data.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo 'Function deployment is NOT verified.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Preserve sanitized verification result only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-function-verification
          path: ${{ runner.temp }}/pennsync-function-verification.json
          if-no-files-found: ignore
          retention-days: 14
