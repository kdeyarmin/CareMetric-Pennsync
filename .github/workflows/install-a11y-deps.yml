name: Install a11y deps (no local machine)

# Triggered automatically once on this branch, or manually from Actions.
# Uses GitHub runners (has network) so no local Node/pnpm is required.
on:
  workflow_dispatch:
  push:
    branches:
      - wire-p1-pure-helpers
    paths:
      - '.github/workflows/install-a11y-deps.yml'

permissions:
  contents: write

concurrency:
  group: install-a11y-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wire-p1-pure-helpers
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install existing lockfile deps
        run: pnpm install --frozen-lockfile

      - name: Add axe / Playwright packages
        run: |
          pnpm add -D vitest-axe@0.1.0 @playwright/test@^1.51.1 @axe-core/playwright@^4.10.7

      - name: Commit package.json + lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore(a11y): install vitest-axe + Playwright axe and update lockfile"
            git push
          fi
