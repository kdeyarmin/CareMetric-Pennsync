name: Review source snapshot
on:
  workflow_dispatch:
    inputs:
      prs:
        description: 'Space-separated PR numbers to snapshot'
        required: true
        default: '149 166 167'
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: review-source-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read PR sources, merge bases and review patches
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ inputs.prs }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/review-sources
          # shellcheck disable=SC2086 — intentional word splitting of PRS
          for pr in $PRS; do
            root="/tmp/review-sources/pennsync$pr"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$root-pr.json"
            sha=$(jq -r .head.sha "$root-pr.json")
            base=$(jq -r .base.sha "$root-pr.json")
            gh api "repos/$GITHUB_REPOSITORY/tarball/$sha" > "$root.tar.gz"
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate --slurp > "$root-comments.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/comments" --paginate --slurp > "$root-review.json"
            gh api "repos/$GITHUB_REPOSITORY/compare/$base...$sha" > "$root-compare.json"
            ancestor=$(jq -r .merge_base_commit.sha "$root-compare.json")
            gh api "repos/$GITHUB_REPOSITORY/tarball/$ancestor" > "$root-base.tar.gz"
          done
          # Resolve main explicitly: $base above is the last PR's base, not main.
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          gh api "repos/$GITHUB_REPOSITORY/tarball/$main_sha" > /tmp/review-sources/pennsync-main.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: review-source-snapshots
          path: /tmp/review-sources/
          retention-days: 1
          if-no-files-found: error
