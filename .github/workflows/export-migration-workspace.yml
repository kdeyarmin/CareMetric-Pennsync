name: Export isolated migration review dependencies
on:
  push:
    branches: [feat/external-integration-cutover-20260916]
    paths: [.github/workflows/export-migration-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    name: Development dependencies only - not deployment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pinned development dependencies
        run: pnpm install --frozen-lockfile
      - name: Package development dependencies only
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/pennsync-development-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pennsync-development-dependencies
          path: /tmp/pennsync-development-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
