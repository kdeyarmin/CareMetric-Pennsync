name: Export isolated migration package manager
on:
  push:
    branches: [feat/external-integration-cutover-20260916]
    paths: [.github/workflows/export-migration-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    name: Public package-manager archive only - not deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Fetch the exact package-manager archive without lifecycle scripts
        run: npm pack pnpm@11.9.0 --ignore-scripts --pack-destination /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: pennsync-package-manager
          path: /tmp/pnpm-11.9.0.tgz
          retention-days: 1
          if-no-files-found: error
