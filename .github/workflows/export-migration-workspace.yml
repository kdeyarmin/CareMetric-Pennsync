name: Export isolated migration review workspace
on:
  push:
    branches: [feat/external-integration-cutover-20260916]
    paths: [.github/workflows/export-migration-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    name: Source export only - not application validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Package tracked source and Git objects only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pennsync-review-runtime
          git archive --format=tar.gz HEAD > /tmp/pennsync-review-runtime/workspace.tar.gz
          git bundle create /tmp/pennsync-review-runtime/repository.bundle HEAD refs/remotes/origin/main
          cp "$(command -v node)" /tmp/pennsync-review-runtime/node
          printf '%s\n' "$GITHUB_SHA" > /tmp/pennsync-review-runtime/source-revision.txt
          printf '%s\n' 'Source export only. Application dependency installation failed independently in run 35144520710; this job does not validate or deploy the application.' > /tmp/pennsync-review-runtime/SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pennsync-isolated-migration-workspace
          path: /tmp/pennsync-review-runtime/
          retention-days: 1
          if-no-files-found: error
