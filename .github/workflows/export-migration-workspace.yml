name: Retain migration review source
on:
  push:
    branches: [feat/external-integration-cutover-20260916]
    paths: [.github/workflows/export-migration-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    name: Source recovery only - not deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source without credentials or runtime data
        run: git archive --format=tar.gz HEAD > /tmp/pennsync-cutover-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pennsync-cutover-source
          path: /tmp/pennsync-cutover-source.tar.gz
          retention-days: 1
          if-no-files-found: error
