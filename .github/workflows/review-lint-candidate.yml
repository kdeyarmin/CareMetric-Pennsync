name: Prepare reviewed lint candidate
on:
  push:
    branches: [dependabot/npm_and_yarn/development-dependencies-17bb3106b7]
    paths: [.github/workflows/review-lint-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact behavior-preserving replacements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          changes={
            'src/lib/authorityBoundClipboard.js':[('let installed = false;','let installed;')],
            'src/lib/authorityBoundWindows.js':[('let unsafe = false;','let unsafe;'),("let currentTarget = '';",'let currentTarget;'),('let elements = [];','let elements;')],
            'src/lib/browserAuthorityEpoch.js':[('let previous = null;','let previous;')],
            'src/lib/patientVisitReadContainmentContract.spec.js':[('let segments = null;','let segments;'),('let property = null;','let property;')],
            'src/lib/tenantSdkRealmGate.js':[('let cleanup = null;','let cleanup;')],
            'src/main.jsx':[('let parentOrigin = null','let parentOrigin')],
          }
          entries=[]
          for name,replacements in changes.items():
            p=Path(name);text=p.read_text()
            for old,new in replacements:
              assert text.count(old)==1,(name,old)
              text=text.replace(old,new)
            p.write_text(text)
            entries.append({'path':name,'mode':'100644','type':'blob','content':text})
          entries.append({'path':'.github/workflows/review-lint-candidate.yml','mode':'100644','type':'blob','sha':None})
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()
          Path('/tmp/review-tree.json').write_text(json.dumps({'base_tree':tree,'tree':entries}))
          PY
          git diff --check
      - name: Create candidate objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/review-candidate
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/review-tree.json > /tmp/review-candidate/tree.json
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          tree=json.loads(Path('/tmp/review-candidate/tree.json').read_text())['sha']
          Path('/tmp/review-commit.json').write_text(json.dumps({'message':'fix(ci): preserve authority behavior under ESLint 10','tree':tree,'parents':[os.environ['GITHUB_SHA']]}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input /tmp/review-commit.json > /tmp/review-candidate/candidate.json
          cp /tmp/review-tree.json /tmp/review-candidate/changes.json
      - uses: actions/upload-artifact@v4
        with:
          name: review-lint-candidate
          path: /tmp/review-candidate/
          retention-days: 1
          if-no-files-found: error
