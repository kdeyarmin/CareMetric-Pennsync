name: Accessibility (axe)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/a11y.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/a11y.yml'

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-rules-unit:
    name: axeRules unit (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node --test src/lib/axeRules.test.js src/lib/accessibilitySmokeMatrix.test.js

  component-a11y:
    name: Component axe (Vitest + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:a11y

  public-route-a11y:
    name: Public route axe (Playwright + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:a11y:e2e:install
      - run: pnpm run build
        env:
          VITE_BASE44_APP_BASE_URL: http://127.0.0.1:5173
      - run: pnpm run test:a11y:e2e
        env:
          CI: true
