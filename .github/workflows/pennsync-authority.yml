name: PennSync independent authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pennsync-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Verify authority transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: |
            services/authority-store/pnpm-lock.yaml
            services/integration-runtime/tests/pnpm-lock.yaml
      - name: Install isolated authority test dependencies
        run: pnpm --dir services/authority-store install --ignore-workspace --frozen-lockfile
      - name: Install isolated integration migration test dependencies
        run: pnpm --dir services/integration-runtime/tests install --ignore-workspace --frozen-lockfile
      - name: Verify PostgreSQL authorization and transaction races
        run: node --test services/authority-store/tests/postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify PostgreSQL S4 atomicity and transaction races
        run: node --test services/authority-store/tests/s4-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify current visit documentation disclosure and revocation races
        run: node --test services/authority-store/tests/visit-documentation-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify explicit patient context disclosure and revocation races
        run: node --test services/authority-store/tests/patient-context-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify saved visit discovery and current scope
        run: node --test services/authority-store/tests/visits-schedule-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify referral patient selection and revocation races
        run: node --test services/authority-store/tests/referral-patients-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify saved referral discovery and revocation races
        run: node --test services/authority-store/tests/referral-list-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify owned synthetic archive patient import and rollback
        run: node --test tools-pennsync-archive-import.postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify PostgreSQL S3 referral transactions and races
        run: node --test services/authority-store/tests/s3-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify record contract concurrency
        run: node --test services/authority-store/tests/record-contract-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Verify fresh integration database restoration
        run: node --test services/integration-runtime/tests/postgres-bootstrap.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Install PostgreSQL 17 client tools only
        shell: bash
        run: |
          set -euo pipefail
          # The runner ships PostgreSQL 16 and removes its PGDG source/key.
          # Use the official signed repository; install no server package.
          if ! grep -Rqs 'apt.postgresql.org/pub/repos/apt' /etc/apt/sources.list /etc/apt/sources.list.d; then
            runner_codename="$(. /etc/os-release && test "$ID" = ubuntu && printf '%s' "$VERSION_CODENAME")"
            [[ "$runner_codename" =~ ^[a-z]+$ ]]
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              --output /usr/share/postgresql-common/pgdg/pennsync-ci.asc
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/pennsync-ci.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$runner_codename" \
              | sudo tee /etc/apt/sources.list.d/pennsync-ci-pgdg.list > /dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - name: Verify disposable synthetic database backup and restore
        run: node --test services/authority-store/tests/restore-postgres.test.mjs
        env:
          PENNSYNC_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
          PENNSYNC_TEST_PG_BIN: /usr/lib/postgresql/17/bin
      - name: Retain sanitized local database restore receipt
        uses: actions/upload-artifact@v7
        with:
          name: pennsync-local-database-restore
          path: work/restore-rehearsal/receipt-*.json
          if-no-files-found: error
          retention-days: 7

  http:
    name: Verify independent Auth and API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: |
            services/authority-store/pnpm-lock.yaml
            services/integration-runtime/tests/pnpm-lock.yaml
      - name: Install isolated authority test dependencies
        run: pnpm --dir services/authority-store install --ignore-workspace --frozen-lockfile
      - name: Install isolated integration migration test dependencies
        run: pnpm --dir services/integration-runtime/tests install --ignore-workspace --frozen-lockfile
      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_dir="$(mktemp -d "$RUNNER_TEMP/pennsync-supabase.XXXXXX")"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            https://github.com/supabase/cli/releases/download/v2.109.1/supabase_2.109.1_linux_amd64.tar.gz \
            --output "$cli_dir/cli.tar.gz"
          printf '%s  %s\n' '36d87b7fe6b4bcfe89ac47a4354e526cff22480224de426d7b370f6934556976' "$cli_dir/cli.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$cli_dir/cli.tar.gz" --directory "$cli_dir" supabase supabase-go
          printf '%s\n' "$cli_dir" >> "$GITHUB_PATH"
      - name: Verify local-only lifecycle boundaries
        run: node --test services/authority-store/tests/http-boundary.test.mjs
      - name: Verify complete runtime schema readiness boundaries
        run: node --test services/integration-runtime/tests/http-schema-ready.test.mjs
      - name: Start isolated local Auth and API
        run: node services/authority-store/tests/http-local-stack.mjs start
      - name: Verify real signed sessions and tenant authority over HTTP
        run: node --test services/authority-store/tests/http-authority.test.mjs
      - name: Verify archived synthetic patients with existing real Auth identities
        run: node --test services/authority-store/tests/http-archive-import.test.mjs
      - name: Verify real integration platform restoration and RPCs
        run: node --test services/integration-runtime/tests/http-bootstrap.test.mjs
      - name: Verify synthetic private file bytes and restoration
        run: node --test services/integration-runtime/tests/http-storage.test.mjs
      - name: Stop isolated local stack
        if: always()
        run: node services/authority-store/tests/http-local-stack.mjs stop

  hosted-gap:
    name: Report the hosted staging migration gap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: services/authority-store/pnpm-lock.yaml
      - name: Install isolated authority dependencies
        run: pnpm --dir services/authority-store install --ignore-workspace --frozen-lockfile
      # Read-only. `tools-pennsync-migrate.mjs` plans by default and applies
      # only with `--apply`, which this job never passes: a deployment is
      # migrated by an operator who can see the plan first, never by CI.
      #
      # It reports how far the hosted staging project is behind the committed
      # migrations. That gap went unmeasured from the day the record store
      # merged, because nothing looked -- the suites all run against PGlite and
      # a throwaway local cluster, which are green whatever the hosted project
      # holds.
      #
      # Skips rather than fails without the secret, so a fork's pull request
      # still passes. Once the secret exists the plan is visible on every run.
      # NEVER on `pull_request`. The earlier condition deliberately ran it for
      # same-repository branches, which handed PENNSYNC_STAGING_DATABASE_URL to
      # the PR's own checked-out `tools-pennsync-migrate.mjs`: anyone able to
      # push a branch could edit that script, or this step, to disclose the
      # credential or write with it before review. The URL needs migration-owner
      # privileges for `--apply`, so it is only ever handed to code that has
      # already landed on main.
      #
      # The REF decides, not the event. Excluding `pull_request` was enough while
      # the only secret here was a staging-specific database URL; it is not now.
      # `workflow_dispatch` names no branch, so a collaborator could dispatch
      # this workflow against a ref they control, `actions/checkout` would take
      # that ref, and the step would hand their edited script the secrets. A
      # manual run on main is still fine and still reaches this; a manual run on
      # anything else no longer does.
      #
      # That distinction matters more for the token than for the URL: the URL
      # reaches one staging database, while a Supabase management token is
      # account-wide and would reach every project in the organisation.
      # The URL may be a postgres one or `supabase://<project-ref>`, and on a
      # hosted runner it usually has to be the second: Supabase's direct
      # database host is IPv6-only and the poolers want TCP 5432/6543, neither
      # of which is reachable from a runner allowed outbound HTTPS and nothing
      # else. The management transport needs SUPABASE_ACCESS_TOKEN, which is
      # why both secrets are here; a postgres URL simply ignores it.
      - name: Plan the hosted staging migration
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          PENNSYNC_MIGRATE_DATABASE_URL: ${{ secrets.PENNSYNC_STAGING_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PENNSYNC_MIGRATE_DATABASE_URL:-}" ]; then
            echo "PENNSYNC_STAGING_DATABASE_URL is not configured; skipping the hosted plan." >&2
            echo "The gap stays unmeasured until it is. See docs/RAILWAY_GO_LIVE_PLAN_2026-09-21.md stage A." >&2
            exit 0
          fi
          case "${PENNSYNC_MIGRATE_DATABASE_URL}" in
            supabase://*)
              if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
                echo "A supabase:// target needs SUPABASE_ACCESS_TOKEN; skipping the hosted plan." >&2
                exit 0
              fi
              ;;
          esac
          node tools-pennsync-migrate.mjs

  hosted-store:
    name: Verify the committed store on hosted staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: services/authority-store/pnpm-lock.yaml
      - name: Install isolated authority dependencies
        run: pnpm --dir services/authority-store install --ignore-workspace --frozen-lockfile
      # The suites above build their own database and are green whatever the
      # hosted project holds -- which is how it stayed fifty-nine migrations
      # behind without anything going red. This one measures the migrated
      # project against a reference built from the same committed migrations,
      # so it fails on drift in either direction and on the things only a
      # managed Postgres can contradict: the record owner's attributes, the
      # platform roles that bypass RLS, the grants a caller actually holds.
      #
      # READ-ONLY, and structurally so rather than by intent: the suite checks
      # every statement with the migrate tool's own `isReadOnly`, which fails
      # closed, before sending it. It applies nothing -- a deployment is
      # migrated by an operator who can see the plan first, never by CI.
      #
      # TWO STEPS, because the measurement needs credentials and exercising the
      # suite does not.
      #
      # This one runs everywhere else and is handed nothing. It proves the file
      # loads, its imports resolve against a checkout that installs only
      # `services/authority-store`, and its skip path is a skip rather than a
      # silent pass. Every hosted assertion reports itself skipped, with the
      # reason.
      - name: Exercise the suite without a hosted target
        if: ${{ github.ref != 'refs/heads/main' }}
        run: node --test services/authority-store/tests/hosted-store.test.mjs
      # And this one does the measuring, on main only.
      #
      # The `if:` is the whole containment and `src/testRegistryContract.test.js`
      # ratchets it: the step receiving the token must be gated on the REF. An
      # env-level `github.ref == ... && secrets.X || ''` keeps the secret out of
      # the environment just as well, and was how this was first written, but
      # the property then lives in an expression somebody has to evaluate in
      # their head instead of one line they can read. Excluding `pull_request`
      # is not enough either: `workflow_dispatch` names no branch, so a
      # collaborator could dispatch against a ref they control and
      # `actions/checkout` would take it.
      #
      # That matters most for the token. A staging database URL reaches one
      # database; a Supabase personal access token reaches every project in the
      # account.
      #
      # So the hosted half of stage A's exit runs on main and on a manual run
      # from main, and not on a pull request branch. That is narrower than the
      # plan's "CI running them on every PR" and it is the safe reading of it;
      # closing the gap needs a credential scoped to reads on one project,
      # which does not exist today.
      #
      # The credential check is NOT belt-and-braces. The suite turns a missing
      # target into `{ skip: <reason> }` on every test, which is right for the
      # step above and would be silent failure here: a renamed or expired
      # secret would leave this job green while reading nothing at all, and a
      # required check that has quietly stopped checking is the exact shape
      # this whole job exists to catch -- the hosted project sat fifty-nine
      # migrations behind because nothing looked.
      #
      # HOSTED_MEASUREMENT_REQUIRED governs what an ABSENT credential means,
      # and nothing else. Both PENNSYNC_STAGING_DATABASE_URL and
      # SUPABASE_ACCESS_TOKEN are required repository secrets for this job.
      # Keep the flag 'true' so removing either secret fails main rather than
      # silently leaving the hosted staging store unmeasured.
      #
      # A credential that IS set and unusable is a different case and stays
      # fatal either way. The flag never decides whether to RUN: complete
      # credentials are measured regardless of its value.
      - name: Measure the hosted staging store
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          PENNSYNC_HOSTED_DATABASE_URL: ${{ secrets.PENNSYNC_STAGING_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HOSTED_MEASUREMENT_REQUIRED: 'true'
        run: |
          set -uo pipefail
          # `|| gate=$?` rather than a bare call: Actions runs this under
          # `bash -e`, which `set -uo pipefail` does NOT clear, so a bare
          # invocation would end the step AT the gate's exit code instead of
          # letting it branch -- which is exactly how the stand-down exit of 3
          # failed main once. The left side of `||` is exempt from -e.
          gate=0
          node tools-pennsync-hosted-gate.mjs || gate=$?
          if [ "$gate" -eq 3 ]; then
            exit 0
          fi
          if [ "$gate" -ne 0 ]; then
            exit "$gate"
          fi
          node --test services/authority-store/tests/hosted-store.test.mjs
