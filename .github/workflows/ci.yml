name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Migration tests compare against a fixed prior release.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated authority test dependencies
        run: pnpm --dir services/authority-store install --ignore-workspace --frozen-lockfile
      - name: Install ported API service dependencies
        run: pnpm --dir services/pennsync-api install --frozen-lockfile

      # Base44's managed preview resolves dependencies with npm, not pnpm.
      # Validate that path independently: pnpm can accept peer combinations
      # that npm rejects before the preview server ever starts.
      - name: Check Base44 npm dependency compatibility
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d "$RUNNER_TEMP/base44-npm-check.XXXXXX")"
          trap 'rm -rf "$check_dir"' EXIT
          cp package.json "$check_dir/package.json"
          cp -R vendor "$check_dir/vendor"
          cd "$check_dir"
          npm exec --yes --package=node@20.20.2 --package=npm@10.8.2 -- npm install \
            --package-lock-only --ignore-scripts --no-audit --no-fund \
            --legacy-peer-deps=false --force=false

      - name: Lint GitHub Actions workflows
        run: pnpm run lint:actions

      - name: Lint
        run: pnpm run lint

      # The eleven scripts `pnpm test` chains, invoked one per step instead of
      # through the chain. `pnpm test` is `a && b && ... && k`, so a non-zero exit
      # anywhere stops it: the job still reds, but every later script's findings
      # are hidden behind one failure.
      #
      # That affects ELEVEN scripts, not five. Five — pennsync-transfer,
      # authority-store, pennsync-api, central-admin and dedupe — have no second
      # runner anywhere, and that is the floor. The other four (utils, contracts,
      # security, components) are re-run by name in workflow-quality.yml, but that
      # workflow is path-filtered on both pull_request and push, and its list names
      # no services/** path and no tools-*.mjs path. So for a change touching only
      # services/ or only the tooling it does not run at all, and all eleven ride
      # the chain. This file is itself outside that list. A path-filtered runner is
      # not a substitute.
      #
      # This is the argument the exit-gate step below already makes, applied one
      # level out: a regression should be legible rather than surfacing as one
      # failed assertion among thousands. Here it also has to be VISIBLE at all.
      # It also removes the reason to move that step: a gate failure is legible in
      # the utility step directly, instead of depending on a later step having run.
      #
      # `if: ${{ !cancelled() }}` on EVERY step of this block is what buys that: a
      # failing script no longer suppresses its siblings, and because the steps
      # after this block keep the default `success()`, the build and the gates
      # still skip and the job still fails.
      #
      # It used to read "from the second step on", with the first keeping the
      # default "so a lint failure above still stops everything". That last clause
      # was FALSE, and measured so: `!cancelled()` is true after an earlier step
      # has failed and goes false only on cancellation, so a red lint took out
      # this one step and the eight after the block, while the ten that were guarded
      # then ran regardless. It stopped one script, not everything — and that script
      # was the worst one to lose. `test:pennsync-transfer` is first in the list
      # of five with no second runner, and `tools-pennsync-migrate.test.mjs`'s
      # "the committed migrations carry no ledger-name collision" is the only
      # thing in the repository that crosses that guard against the REAL
      # migration directory rather than a synthetic list. For a change touching
      # only the tooling, workflow-quality and both axe jobs name no
      # `tools-*.mjs` path and do not run at all, so this job is the whole of CI
      # and there was no second chance anywhere.
      #
      # Three threads read the boundary wrong before it was measured, twice in
      # opposite directions, and the comment sat three lines above the sentence it
      # contradicted. Two notes for whoever checks it next. ENUMERATE the steps;
      # do not grep near them — a fixed-size lookahead from each `- name:` bleeds
      # into the following step and attributes its guard to the wrong one, which
      # is how the inversion happened. And COUNT THE `if:` DIRECTIVE LINES, not
      # occurrences of the string: this comment contains the string it describes,
      # so any grep for it runs higher than the number of guarded steps. No figure
      # is written here on purpose — a first draft of this very paragraph stated
      # the count, and the edit that added the eleventh guard falsified it in the
      # same commit, three lines below a warning about checking the file by grep.
      #
      # Keep `pnpm test` itself as the single local command. If a script is added
      # to the chain, add a step for it here — src/testRegistryContract.test.js
      # checks that every suite runs somewhere, not that this list is complete.
      - name: Run PennSync transfer tool tests
        if: ${{ !cancelled() }}
        run: pnpm run test:pennsync-transfer

      - name: Run authority store tests
        if: ${{ !cancelled() }}
        run: pnpm run test:authority-store

      - name: Run external integration tests
        if: ${{ !cancelled() }}
        run: pnpm run test:external-integrations

      - name: Run ported business API tests
        if: ${{ !cancelled() }}
        run: pnpm run test:pennsync-api

      - name: Run owned static site host tests
        if: ${{ !cancelled() }}
        run: pnpm run test:pennsync-site

      - name: Run central admin contract tests
        if: ${{ !cancelled() }}
        run: pnpm run test:central-admin

      - name: Run utility unit tests
        if: ${{ !cancelled() }}
        run: pnpm run test:utils

      - name: Run schema-contract tests
        if: ${{ !cancelled() }}
        run: pnpm run test:contracts

      - name: Run security guardrail tests
        if: ${{ !cancelled() }}
        run: pnpm run test:security

      - name: Run deduplication tests
        if: ${{ !cancelled() }}
        run: pnpm run test:dedupe

      - name: Run HHGS adapter tests
        if: ${{ !cancelled() }}
        run: pnpm run test:hhgs

      - name: Run component tests
        if: ${{ !cancelled() }}
        run: pnpm run test:components

      # BLOCKING gate. The worksheet is the artifact a clinical reviewer signs,
      # so a drifted copy means the review on file describes item definitions the
      # app no longer has.
      - name: Check OASIS review worksheet is current
        run: pnpm run check:oasis-worksheet

      - name: Check generated shared helpers
        run: pnpm run check:shared-helpers

      - name: Check Base44 function syntax
        run: pnpm run check:backend-transpile

      # BLOCKING gate. A duplicate data key in an object literal is legal, so
      # two branches each adding the same key to one registry literal merge with
      # no conflict, the later silently wins, and node --check passes — the merge
      # is the only tree the defect exists in, so neither branch's own green sees
      # it. esbuild already parses it (and reads JSX and TS, where a plain-JS
      # parser would go blind on most of the tree); this keeps the warning the
      # transpile gate discards. The gate scans every tracked .js/.cjs/.mjs/.jsx/
      # .ts/.tsx — the hazard is the same in all of them — and fails closed on a
      # file it cannot parse, so a population that shrank through a parse failure
      # can never produce a clean line. tools-duplicate-object-keys.test.mjs runs
      # in test:utils; naming it here makes a hit legible instead of one
      # assertion among thousands.
      - name: Check for duplicate object keys
        run: pnpm run check:duplicate-keys

      # BLOCKING gates for the Base44 exit. These also run inside the utility
      # suite above (tools-transition-disposition.test.mjs and its siblings in
      # test:utils); naming them separately makes a migration regression legible
      # instead of surfacing as one failed assertion among thousands.
      - name: Check Base44 exit gates
        run: |
          pnpm run check:transition-disposition
          pnpm run check:base44-surface
          pnpm run check:frontend-destination
          pnpm run check:entity-routes
          pnpm run check:file-references
          pnpm run check:entity-schema-plan
          pnpm run check:tenant-paths
          pnpm run check:tenant-revalidation
          pnpm run check:release-ladder
          pnpm run check:tenant-decisions
          pnpm run check:record-brokers
          pnpm run check:read-purpose-policy

      - name: Typecheck informational baseline
        run: pnpm run typecheck
        continue-on-error: true

      # jsconfig.json sets checkJs:false, so the step above can only catch syntax
      # and module-resolution errors — it cannot fail on a type error. This runs a
      # real checkJs pass and filters to the error codes that indicate a genuine
      # defect rather than a missing annotation (see tools-typecheck-signal.mjs).
      - name: High-signal typecheck
        run: pnpm run typecheck:signal

      - name: Build
        run: pnpm run build
        env:
          # The Base44 Vite plugin emits a proxy warning when this optional dev-server
          # target is unset. CI does not contact this URL during production builds;
          # setting it keeps GitHub logs focused on actionable failures.
          VITE_BASE44_APP_BASE_URL: http://127.0.0.1:5173

      - name: Production audit informational baseline
        run: pnpm run audit:prod
        continue-on-error: true

      # The step above carries continue-on-error, so it reports and can never
      # fail a build: on 2026-09-30 it went from one low advisory to fourteen,
      # seven of them high, across green runs. Keep it for the printed tables and
      # gate on the baseline instead, which fails on an advisory that is new, that
      # escalated, that reached a new dependency path, or whose baseline entry is
      # now stale. The known ones are recorded in audit-advisory-baseline.json
      # with a reason each, so this is green on a repository whose advisories have
      # all been read. It fails closed: an audit that cannot run is reported as
      # unmeasured rather than as nothing found.
      - name: Dependency advisory baseline
        run: pnpm run check:audit-advisories
