name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check generated shared helpers
        run: npm run check:shared-helpers

      - name: Check Base44 function syntax
        run: npm run check:backend-transpile

      - name: Typecheck informational baseline
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Production audit informational baseline
        run: npm run audit:prod
        continue-on-error: true
