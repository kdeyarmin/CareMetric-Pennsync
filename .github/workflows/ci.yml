name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Migration tests compare against a fixed prior release.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated authority test dependencies
        run: pnpm --dir services/authority-store install --ignore-workspace --frozen-lockfile
      - name: Install ported API service dependencies
        run: pnpm --dir services/pennsync-api install --frozen-lockfile

      # Base44's managed preview resolves dependencies with npm, not pnpm.
      # Validate that path independently: pnpm can accept peer combinations
      # that npm rejects before the preview server ever starts.
      - name: Check Base44 npm dependency compatibility
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d "$RUNNER_TEMP/base44-npm-check.XXXXXX")"
          trap 'rm -rf "$check_dir"' EXIT
          cp package.json "$check_dir/package.json"
          cp -R vendor "$check_dir/vendor"
          cd "$check_dir"
          npm exec --yes --package=node@20.20.2 --package=npm@10.8.2 -- npm install \
            --package-lock-only --ignore-scripts --no-audit --no-fund \
            --legacy-peer-deps=false --force=false

      - name: Lint GitHub Actions workflows
        run: pnpm run lint:actions

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      # BLOCKING gate. The worksheet is the artifact a clinical reviewer signs,
      # so a drifted copy means the review on file describes item definitions the
      # app no longer has.
      - name: Check OASIS review worksheet is current
        run: pnpm run check:oasis-worksheet

      - name: Check generated shared helpers
        run: pnpm run check:shared-helpers

      - name: Check Base44 function syntax
        run: pnpm run check:backend-transpile

      # BLOCKING gates for the Base44 exit. These also run inside `pnpm test`;
      # naming them separately makes a migration regression legible instead of
      # surfacing as one failed assertion among thousands.
      - name: Check Base44 exit gates
        run: |
          pnpm run check:transition-disposition
          pnpm run check:base44-surface
          pnpm run check:frontend-destination
          pnpm run check:file-references
          pnpm run check:entity-schema-plan
          pnpm run check:tenant-paths
          pnpm run check:tenant-decisions
          pnpm run check:record-brokers
          pnpm run check:read-purpose-policy

      - name: Typecheck informational baseline
        run: pnpm run typecheck
        continue-on-error: true

      # jsconfig.json sets checkJs:false, so the step above can only catch syntax
      # and module-resolution errors — it cannot fail on a type error. This runs a
      # real checkJs pass and filters to the error codes that indicate a genuine
      # defect rather than a missing annotation (see tools-typecheck-signal.mjs).
      - name: High-signal typecheck
        run: pnpm run typecheck:signal

      - name: Build
        run: pnpm run build
        env:
          # The Base44 Vite plugin emits a proxy warning when this optional dev-server
          # target is unset. CI does not contact this URL during production builds;
          # setting it keeps GitHub logs focused on actionable failures.
          VITE_BASE44_APP_BASE_URL: http://127.0.0.1:5173

      - name: Production audit informational baseline
        run: pnpm run audit:prod
        continue-on-error: true
