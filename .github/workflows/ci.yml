name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint GitHub Actions workflows
        run: npm run lint:actions

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check generated shared helpers
        run: npm run check:shared-helpers

      - name: Check Base44 function syntax
        run: npm run check:backend-transpile

      - name: Typecheck informational baseline
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # The Base44 Vite plugin emits a proxy warning when this optional dev-server
          # target is unset. CI does not contact this URL during production builds;
          # setting it keeps GitHub logs focused on actionable failures.
          VITE_BASE44_APP_BASE_URL: http://127.0.0.1:5173

      - name: Production audit informational baseline
        run: npm run audit:prod
        continue-on-error: true
