name: Install virtualization deps (no local machine)

on:
  workflow_dispatch:
  push:
    branches:
      - wire-p1-pure-helpers
    paths:
      - '.github/workflows/install-virtual-deps.yml'

permissions:
  contents: write

concurrency:
  group: install-virtual-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wire-p1-pure-helpers
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install existing lockfile deps
        run: pnpm install --frozen-lockfile

      - name: Add @tanstack/react-virtual
        run: pnpm add @tanstack/react-virtual@^3.13.12

      - name: Commit package.json + lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore(P2-03): install @tanstack/react-virtual and update lockfile"
            git push
          fi
