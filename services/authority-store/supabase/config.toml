# Created by Supabase CLI 2.109.1 `supabase init`; narrowed for disposable HTTP acceptance.
# LOCAL ONLY. Never link this directory or deploy this config to a hosted project.
project_id = "local-pennsync-authority"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

# Local email sink only. No external SMTP/SMS/provider credentials are configured.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# CLI 2.109.1 maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED: password login needs it.
# Public account creation stays disabled by [auth].enable_signup = false above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
