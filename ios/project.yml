# XcodeGen spec for the PennSync iOS shell.
# Run `xcodegen generate` in this directory, then open PennSync.xcodeproj.
# App Store Connect has refused uploads built with anything older than Xcode 26
# and the iOS 26 SDK since 2026-04-28; archive with Xcode 26 or newer.
name: PennSync
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PennSync:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      # Swift sources compile; Assets.xcassets and PrivacyInfo.xcprivacy are
      # added to the resources phase; Info.plist is excluded automatically.
      - path: PennSync
    settings:
      base:
        # Must match the existing CareMetric AI App Store record (Apple ID
        # 6757097720). Changing this creates a different app instead of an
        # update for current users.
        PRODUCT_BUNDLE_IDENTIFIER: com.caremetric.ai
        INFOPLIST_FILE: PennSync/Info.plist
        # Must be HIGHER than the last approved version of record 6757097720,
        # which was "1.0" when read from itunes.apple.com/lookup on 2026-10-08.
        # App Store Connect compares component-wise with missing components as
        # zero, so "1.0.0" equals "1.0" and is refused at upload (ITMS-90062).
        # Bump this again for every later submission; the build number below
        # restarts at 1 for each new marketing version.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: LaunchBackground
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  PennSync:
    build:
      targets:
        PennSync: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
