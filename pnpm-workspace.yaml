allowBuilds:
  core-js: true
  esbuild: true
overrides:
  '@telnyx/video>uuid': 11.1.1
  # Twelve advisories (7 high, 5 moderate) against axios <1.20.0, every one
  # reached transitively via @base44/sdk > axios. The SDK declares ^1.18.1, so
  # 1.20.0 is inside its own range and it does not need to move. See
  # docs/DEPENDENCY_ADVISORY_BASELINE.md for which of them the browser bundle
  # can actually reach.
  axios: 1.20.0
  brace-expansion@^1.1.7: 1.1.18
  esbuild: 0.28.2
  quill: 2.0.3
  # GHSA-2m8v-j782-fhvr (high): Socket.IO zero-attachment memory exhaustion in
  # socket.io-parser <4.2.7, reached transitively via @base44/sdk >
  # socket.io-client. Nothing in this repo can bump it directly, so pin the
  # patched line here. 4.2.7 satisfies socket.io-client's ~4.2.x range.
  socket.io-parser: 4.2.7
  # GHSA-68fv-2mgg-jv7q (high): event-loop denial of service through indexed
  # source-map section offsets in source-map-js <1.2.2, reached transitively
  # via postcss (autoprefixer, a prod dependency), @tailwindcss/node and
  # css-tree > jsdom. Every consumer declares a ^1.x range that 1.2.2 is
  # inside, so none of them needs to move; pin the patched line here.
  source-map-js: 1.2.2
  undici: 7.29.0
  ws: 8.21.0
minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - vitest@4.1.10
  - '@vitest/expect@4.1.10'
  - '@vitest/mocker@4.1.10'
  - '@vitest/pretty-format@4.1.10'
  - '@vitest/runner@4.1.10'
  - '@vitest/snapshot@4.1.10'
  - '@vitest/spy@4.1.10'
  - '@vitest/utils@4.1.10'
  - autoprefixer@10.5.3
  - '@base44/sdk@0.8.40 || 0.8.46 || 0.8.48 || 0.8.51'
  - baseline-browser-mapping@2.11.4
  - globals@17.8.0
  - jsdom@30.0.0
  - typescript@7.0.2
  - esbuild@0.28.2
  - framer-motion@12.43.0
  - lucide-react@1.28.0
  - pdfjs-dist@6.2.108
  - '@base44/vite-plugin@1.0.34 || 1.0.36 || 1.0.37 || 1.0.39 || 1.0.40 || 1.0.41'
