allowBuilds:
  core-js: true
  esbuild: true
overrides:
  '@telnyx/video>uuid': 11.1.1
  brace-expansion@^1.1.7: 1.1.17
  esbuild: 0.28.1
  quill: 2.0.3
  # GHSA-2m8v-j782-fhvr (high): Socket.IO zero-attachment memory exhaustion in
  # socket.io-parser <4.2.7, reached transitively via @base44/sdk >
  # socket.io-client. Nothing in this repo can bump it directly, so pin the
  # patched line here. 4.2.7 satisfies socket.io-client's ~4.2.x range.
  socket.io-parser: 4.2.7
  undici: 7.28.0
  ws: 8.21.0
# eslint-plugin-react / jsx-a11y have not widened their peer ranges to eslint 10
# yet, but both run clean under 10.8.0 in this repo (CI lint gate).
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
minimumReleaseAgeExclude:
  - brace-expansion@1.1.17
  - vitest@4.1.10
  - '@vitest/expect@4.1.10'
  - '@vitest/mocker@4.1.10'
  - '@vitest/pretty-format@4.1.10'
  - '@vitest/runner@4.1.10'
  - '@vitest/snapshot@4.1.10'
  - '@vitest/spy@4.1.10'
  - '@vitest/utils@4.1.10'
  - autoprefixer@10.5.3
  - '@base44/sdk@0.8.40'
  - baseline-browser-mapping@2.11.4
  - globals@17.8.0
  - jsdom@30.0.0
  - typescript@7.0.2
  - esbuild@0.28.1
  - framer-motion@12.43.0
  - lucide-react@1.28.0
  - pdfjs-dist@6.2.108
