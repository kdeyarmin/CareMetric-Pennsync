<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f3261" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` (not black-translucent): the fixed mobile header is white, and
         black-translucent always draws WHITE status-bar text — an invisible
         clock/battery over the white header when installed to the iOS home
         screen. `default` renders dark text and stays readable. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PennSync" />
    <meta name="description" content="PennSync by CareMetric — intelligent, AI-powered documentation and analytics platform for clinicians." />
    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in src/main.jsx),
         so no third-party Google Fonts request is made. -->
    <title>PennSync by CareMetric</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
