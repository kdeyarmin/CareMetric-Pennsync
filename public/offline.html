<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3261" />
    <title>PennSync — Offline</title>
    <!-- Fully self-contained (inline styles, no images/scripts fetched) so it
         renders with zero network. Served by sw.js only when a navigation fails
         and no app shell has ever been cached on this device. -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #1f3261 0%, #2a4480 100%);
        color: #fff;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        text-align: center;
      }
      .card { max-width: 420px; }
      .badge {
        width: 72px; height: 72px;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.12);
        display: flex; align-items: center; justify-content: center;
        font-size: 34px;
      }
      h1 { font-size: 22px; margin-bottom: 10px; }
      h1 .gold { color: #e8b64c; }
      p { font-size: 15px; line-height: 1.55; color: rgba(255, 255, 255, 0.82); margin-bottom: 28px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #e8b64c; color: #1f3261;
        font-size: 15px; font-weight: 700;
        padding: 12px 32px; border-radius: 10px;
      }
      button:active { transform: scale(0.98); }
      .hint { margin-top: 18px; font-size: 12px; color: rgba(255, 255, 255, 0.55); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">&#128246;</div>
      <h1>Penn<span class="gold">Sync</span> is offline</h1>
      <p>
        No internet connection was found, and this device hasn't loaded the app
        before. Reconnect to Wi&#8209;Fi or cellular data, then try again — visits you
        documented offline are saved on this device and will sync automatically.
      </p>
      <button onclick="window.location.replace('./')">Try Again</button>
      <p class="hint">Reconnecting retries automatically.</p>
    </div>
    <script>
      // Auto-recover the moment connectivity returns.
      window.addEventListener('online', function () { window.location.replace('./'); });
    </script>
  </body>
</html>
